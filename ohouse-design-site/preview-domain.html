<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>홈 · Screens — Ohouse Design</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="preview-shared.css" />

<!--
  ====================================================================
  파일명     : preview-domain.html  (= Screens 탭 기본 진입)
  Owner     : ___  (이 탭의 디자인 책임자를 적어주세요)
  자유 영역  : <section class="dbody"> ... </section> 내부의
              <div class="dpanel" data-panel="screens">  부분만 자유롭게 디자인.
  ⚠️ nav / dhead / dtabs 마크업은 다른 탭 파일과 동기화 유지 — 임의 수정 금지.
     공통 스타일은 preview-shared.css 에서만 변경.
  ====================================================================
-->

<style>
  /* 이 탭에서만 쓰는 추가 스타일은 여기에 — 공통 변수/컴포넌트는 preview-shared.css 사용 */
  /* Screens 탭 sub filter */
  .subfilter{display:flex;align-items:center;gap:8px;margin-bottom:24px}
  .subpill{padding:6px 14px;font-size:13px;font-weight:500;color:var(--c-text-muted);
    background:var(--c-bg-elev);border-radius:999px;cursor:pointer;transition:color .15s,background .15s}
  .subpill:hover{color:var(--c-text)}
  .subpill.is-active{background:var(--c-text);color:#fff;font-weight:600}
</style>
</head>
<body>

<!-- ============ nav (공유 셸 — 동기화) ============ -->
<header class="nav-root">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="preview-home.html" class="brand" aria-label="오늘의집">
        <img src="public/ohouse-3d.png" alt="" class="brand__logo" width="32" height="32" />
      </a>
      <nav class="nav-tabs">
        <a class="nav-tab is-active" href="preview-home.html">Ohouse Design</a>
        <a class="nav-tab" href="#">Design system</a>
      </nav>
    </div>
    <div class="nav-search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search Ohouse Design..." />
      <span class="nav-search__kbd">⌘K</span>
    </div>
    <div class="nav-right">
      <button class="nav-icon" aria-label="북마크">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <a class="nav-github" href="#">GitHub</a>
      <div class="nav-avatar" title="요한">요</div>
    </div>
  </div>
</header>

<!-- ============ dhead (공유 셸 — 동기화) ============ -->
<header class="dhead">
  <div class="wrap">
    <h1 class="dhead__title">홈</h1>
    <div class="dhead__meta">
      <div class="dhead__metacol">
        <span class="dhead__metalabel">Product Design Owner</span>
        <span class="dhead__metavalue">요한 <span class="dhead__metavalue-sub">Discovery PD</span></span>
      </div>
      <div class="dhead__metacol">
        <span class="dhead__metalabel">Screens</span>
        <span class="dhead__metavalue">6 <span class="dhead__metavalue-sub">HTML 3 · Figma 3</span></span>
      </div>
      <div class="dhead__metacol">
        <span class="dhead__metalabel">Last updated</span>
        <span class="dhead__metavalue">3일 전 <span class="dhead__metavalue-sub">2026-05-18</span></span>
      </div>
    </div>
  </div>
</header>

<!-- ============ dtabs (공유 셸 — 동기화) ============ -->
<nav class="dtabs" aria-label="domain tabs">
  <div class="wrap dtabs__inner">
    <a class="dtab is-active" href="preview-domain.html">Screens <span class="dtab__count">6</span></a>
    <a class="dtab" href="preview-domain-components.html">Components <span class="dtab__count">4</span></a>
    <a class="dtab" href="preview-domain-policies.html">Policies <span class="dtab__count">2</span></a>
    <a class="dtab" href="preview-domain-experiments.html">Experiments <span class="dtab__count">3</span></a>
  </div>
</nav>

<!-- ============ dbody (이 파일의 자유 영역) ============ -->
<section class="dbody">
  <div class="wrap">
    <div class="dpanel" data-panel="screens">

      <div class="sechead">
        <div class="sechead__title">Screens</div>
        <div class="sechead__count">6 screens · 3일 전 업데이트</div>
      </div>

      <div class="subfilter" id="subfilter">
        <button class="subpill is-active" data-type="all">All</button>
        <button class="subpill" data-type="html">HTML</button>
        <button class="subpill" data-type="figma">Figma</button>
      </div>

      <div class="sgrid" id="sgrid"></div>

    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite">Copied</div>

<script>
/* ────────── 데이터 — 홈 도메인 Screens ────────── */
const screens = [
  { pageId:'home-default',         type:'html',  label:'홈 기본',          markers:[{kind:'route',value:'/home'}] },
  { pageId:'home-new-user',        type:'figma', label:'신규 유저 첫 홈',   markers:[{kind:'state',value:'first-visit'},{kind:'missing-ods',value:'NewUserHero'}] },
  { pageId:'home-recommend-feed',  type:'html',  label:'추천 피드 섹션',    markers:[{kind:'section',value:'reco'}] },
  { pageId:'home-promo-banner',    type:'figma', label:'홈 프로모 배너',    markers:[{kind:'campaign',value:'2026-Q2'}] },
  { pageId:'home-tab-shopping',    type:'html',  label:'쇼핑 탭 홈',        markers:[{kind:'tab',value:'shopping'}] },
  { pageId:'home-tab-content',     type:'figma', label:'콘텐츠 탭 홈',      markers:[{kind:'tab',value:'content'}] },
];
const typeLabel = t => t === 'figma' ? 'Figma' : 'HTML';

const sgrid = document.getElementById('sgrid');
sgrid.innerHTML = screens.map(s => `
  <div class="scard" role="link" tabindex="0" data-type="${s.type}" data-page="${s.pageId}">
    <div class="scard__canvas">
      <span class="scard__pill is-${s.type}">${typeLabel(s.type)}</span>
      <div class="scard__phone">
        <div class="scard__mark">${s.label.slice(0,1)}</div>
      </div>
    </div>
    <div class="scard__meta">
      <span class="scard__label">${s.label}</span>
      <span class="scard__pageid">${s.pageId}</span>
      ${s.markers && s.markers.length ? `
        <div class="scard__markers">
          ${s.markers.slice(0,3).map(m => `<span class="badge${m.kind==='missing-ods'?' badge--warn':''}">@${m.kind}:${m.value}</span>`).join('')}
        </div>` : ''}
    </div>
  </div>
`).join('');

/* sub filter */
const subfilter = document.getElementById('subfilter');
subfilter.addEventListener('click', e => {
  const btn = e.target.closest('.subpill');
  if (!btn) return;
  subfilter.querySelectorAll('.subpill').forEach(b => b.classList.toggle('is-active', b === btn));
  const type = btn.dataset.type;
  sgrid.querySelectorAll('.scard').forEach(card => {
    card.style.display = (type === 'all' || card.dataset.type === type) ? '' : 'none';
  });
});

/* toast helper */
const toast = document.getElementById('toast');
let toastTimer = null;
const showToast = msg => {
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
};

sgrid.addEventListener('click', e => {
  const card = e.target.closest('.scard');
  if (!card) return;
  showToast(`${card.dataset.page} 화면 상세는 곧 연결됩니다`);
});
sgrid.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('.scard');
    if (!card) return;
    e.preventDefault();
    showToast(`${card.dataset.page} 화면 상세는 곧 연결됩니다`);
  }
});
</script>
</body>
</html>
