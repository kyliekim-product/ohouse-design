<script>
const components = [
  { label:'HomeBannerCarousel', type:'screen-only',
    summary:'홈 최상단 풀블리드 캐러셀. ODS Carousel 로 흡수 검토 중.', updated:'2주 전' },
  { label:'HomeSectionHeader',  type:'screen-only',
    summary:'섹션 타이틀 + “더보기” 라인. 폰트 사이즈/우측 액션 변형 3종.', updated:'3주 전' },
  { label:'HomeTabBar',         type:'screen-only',
    summary:'쇼핑/콘텐츠/집구경 3 탭 전환. 1depth 진입 추적 이벤트 포함.', updated:'한 달 전' },
  { label:'HomeRecommendCard',  type:'screen-only',
    summary:'개인화 추천 카드. ODS ProductCard 의 변형, 가격/혜택 라인 별도.', updated:'3일 전' },
];

const cgrid = document.getElementById('cgrid');
cgrid.innerHTML = components.map(c => `
  <div class="lcard">
    <div class="lcard__head">
      <span class="lcard__title">${c.label}</span>
      <span class="badge badge--accent">${c.type}</span>
    </div>
    <p class="lcard__summary">${c.summary}</p>
    <div class="lcard__foot"><span>${c.updated}</span></div>
  </div>
`).join('');
</script>
