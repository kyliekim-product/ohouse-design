    </div>

</section>

<script>
const policies = [
  { label:'홈 노출 우선순위',
    summary:'신규 유저(첫 3회) > 컨텐츠 위주 / 리텐션 > 쇼핑 위주. AB 결과로 매 분기 재조정.',
    overrides:true },
  { label:'프로모 배너 노출 룰',
    summary:'최대 1슬롯 / 24h. 동일 캠페인 중복 노출 금지(Frequency cap = 2).',
    overrides:false },
];

const pgrid = document.getElementById('pgrid');
pgrid.innerHTML = policies.map(p => `
  <div class="lcard">
    <div class="lcard__head">
      <span class="lcard__title">${p.label}</span>
      ${p.overrides ? `<span class="badge badge--warn">overrides</span>` : ''}
    </div>
    <p class="lcard__summary">${p.summary}</p>
  </div>
`).join('');
</script>
