    <div class="nav-search">

  <div class="wrap">
    <h1 class="dhead__title">홈</h1>
    <div class="dhead__meta">
      <div class="dhead__metacol">
        <span class="dhead__metalabel">Product Design Owner</span>
        <span class="dhead__metavalue">요한 <span class="dhead__metavalue-sub">Discovery PD</span></span>
      </div>
      <div class="dhead__metacol">
        <span class="dhead__metalabel">Screens</span>

      <div class="dhead__metacol">

  </div>

<!-- ============ dbody (이 파일의 자유 영역) ============ -->
<section class="dbody">
  <div class="wrap">
    <div class="dpanel" data-panel="experiments">

      <div class="sechead">
        <div class="sechead__title">Experiments</div>
        <div class="sechead__count">3 records</div>
      </div>

      <div class="lgrid" id="egrid"></div>

    </div>
  </div>
</section>

<script>
const experiments = [
  { label:'홈 피드 알고리즘 v3',
    summary:'개인화 weight 0.6 → 0.8 로 상향. 7일 retention +1.8%p, CTR +4.2%.',
    result:'win', updated:'1주 전' },
  { label:'배너 위치: 상단 vs 2번째 섹션',
    summary:'2번째 섹션 이동 시 GMV -0.4% (significant). 상단 유지.',
    result:'loss', updated:'2주 전' },
  { label:'신규 유저 첫 화면 컨텐츠 우선',
    summary:'신규 유저에게 콘텐츠 카드 비중 70%. D1 retention +3.1%, 본격 실험 확장.',
    result:'win', updated:'4일 전' },
];

const egrid = document.getElementById('egrid');
egrid.innerHTML = experiments.map(e => `
  <div class="lcard">
    <div class="lcard__head">
      <span class="lcard__title">${e.label}</span>
      <span class="badge ${e.result==='win'?'badge--success':e.result==='loss'?'badge--fail':''}">${e.result}</span>
    </div>
    <p class="lcard__summary">${e.summary}</p>
    <div class="lcard__foot"><span>${e.updated}</span></div>
  </div>
`).join('');
</script>
</body>
